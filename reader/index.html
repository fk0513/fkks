<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>书架 · 阅读器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ==================== 书架视图 ==================== -->
<section id="view-shelf" class="view">
  <header class="shelf-header">
    <h1>我的书架</h1>
    <div class="shelf-actions">
      <button id="btn-backup" class="btn-ghost" title="导出备份">备份</button>
      <button id="btn-restore" class="btn-ghost" title="从备份恢复">恢复</button>
      <button id="btn-import" class="btn-primary">+ 导入书籍</button>
      <input type="file" id="file-input" accept=".epub,.txt" multiple hidden>
      <input type="file" id="restore-input" accept=".json" hidden>
    </div>
  </header>

  <!-- 空状态 -->
  <div id="shelf-empty" class="empty-state" hidden>
    <div class="empty-icon">📚</div>
    <h2>书架还是空的</h2>
    <p>把 EPUB 或 TXT 文件拖到这里，或者点右上角「导入书籍」</p>
  </div>

  <!-- 书籍列表 -->
  <div id="shelf-grid" class="shelf-grid"></div>

  <!-- 全局拖拽遮罩 -->
  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-inner">松手即可导入</div>
  </div>
</section>

<!-- ==================== 阅读器视图 ==================== -->
<section id="view-reader" class="view" hidden>
  <!-- 顶栏 -->
  <header id="reader-topbar" class="reader-bar reader-topbar">
    <button id="btn-back" class="btn-icon" title="返回书架">←</button>
    <div class="reader-title">
      <span id="reader-book-title">书名</span>
      <span id="reader-chapter" class="reader-chapter"></span>
    </div>
    <div class="reader-tools">
      <button id="btn-toc" class="btn-icon" title="目录">☰</button>
      <button id="btn-settings" class="btn-icon" title="阅读设置">Aa</button>
    </div>
  </header>

  <!-- 正文区 -->
  <div id="reader-stage" class="reader-stage">
    <!-- EPUB 渲染容器 -->
    <div id="epub-viewer" class="epub-viewer"></div>
    <!-- TXT 渲染容器 -->
    <div id="txt-viewer" class="txt-viewer" hidden></div>
    <!-- 加载提示 -->
    <div id="reader-loading" class="reader-loading" hidden>正在打开…</div>
  </div>

  <!-- 底栏 -->
  <footer id="reader-bottombar" class="reader-bar reader-bottombar">
    <span id="progress-percent" class="progress-label">0%</span>
    <input type="range" id="progress-slider" class="progress-slider" min="0" max="100" value="0" step="0.1">
    <span id="progress-pages" class="progress-pages">— / —</span>
  </footer>
</section>

<!-- ==================== 浮层：目录 ==================== -->
<aside id="panel-toc" class="side-panel side-panel-left" hidden>
  <header class="panel-header">
    <h3>目录</h3>
    <button class="btn-icon panel-close" data-close="panel-toc">✕</button>
  </header>
  <nav id="toc-list" class="toc-list"></nav>
</aside>

<!-- ==================== 浮层：标注侧栏 ==================== -->
<aside id="panel-notes" class="side-panel side-panel-right" hidden>
  <header class="panel-header">
    <h3>标注</h3>
    <button class="btn-icon panel-close" data-close="panel-notes">✕</button>
  </header>
  <div id="notes-list" class="notes-list"></div>
</aside>

<!-- ==================== 浮层：阅读设置 ==================== -->
<aside id="panel-settings" class="side-panel side-panel-right" hidden>
  <header class="panel-header">
    <h3>阅读设置</h3>
    <button class="btn-icon panel-close" data-close="panel-settings">✕</button>
  </header>
  <div class="settings-body">
    <div class="setting-row">
      <label>字号</label>
      <div class="setting-control">
        <input type="range" id="set-fontsize" min="12" max="32" step="1" value="18">
        <span id="val-fontsize" class="setting-val">18px</span>
      </div>
    </div>
    <div class="setting-row">
      <label>行距</label>
      <div class="setting-control">
        <input type="range" id="set-lineheight" min="1.2" max="2.6" step="0.1" value="1.8">
        <span id="val-lineheight" class="setting-val">1.8</span>
      </div>
    </div>
    <div class="setting-row">
      <label>主题</label>
      <div class="setting-control theme-group" id="group-theme">
        <button data-theme="light" class="theme-swatch theme-light" title="浅色"></button>
        <button data-theme="sepia" class="theme-swatch theme-sepia" title="护眼"></button>
        <button data-theme="dark" class="theme-swatch theme-dark" title="深色"></button>
      </div>
    </div>
    <div class="setting-row">
      <label>字体</label>
      <div class="setting-control">
        <select id="set-fontfamily">
          <option value="system">系统默认</option>
          <option value="serif">衬线（宋体）</option>
          <option value="sans">无衬线（黑体）</option>
          <option value="kai">楷体</option>
        </select>
      </div>
    </div>
    <div class="setting-row">
      <label>翻页方式</label>
      <div class="setting-control">
        <select id="set-flow">
          <option value="paginated">左右分页</option>
          <option value="scrolled">上下滚动</option>
        </select>
      </div>
    </div>
    <div class="setting-row">
      <label>点击左右翻页</label>
      <div class="setting-control">
        <input type="checkbox" id="set-tapflip" checked>
      </div>
    </div>
    <hr class="setting-divider">
    <button id="btn-open-notes" class="btn-ghost btn-block">查看本书标注</button>
    <button id="btn-del-book" class="btn-danger btn-block">删除这本书</button>
  </div>
</aside>

<!-- 侧栏遮罩（移动端） -->
<div id="panel-backdrop" class="panel-backdrop" hidden></div>

<!-- ==================== 浮层：选中操作条 ==================== -->
<div id="selection-bar" class="selection-bar" hidden>
  <button class="hl-btn" data-color="yellow" title="黄色高亮"></button>
  <button class="hl-btn" data-color="green" title="绿色高亮"></button>
  <button class="hl-btn" data-color="blue" title="蓝色高亮"></button>
  <button id="sel-note" class="sel-note" title="高亮并写笔记">📝</button>
  <button id="sel-cancel" class="sel-cancel" title="取消">✕</button>
</div>

<!-- ==================== 浮层：笔记编辑 ==================== -->
<div id="note-editor" class="note-editor" hidden>
  <div class="note-editor-quote" id="note-quote"></div>
  <textarea id="note-text" placeholder="写下你的想法…"></textarea>
  <div class="note-editor-actions">
    <button id="note-delete" class="btn-danger">删除标注</button>
    <span class="spacer"></span>
    <button id="note-cancel" class="btn-ghost">取消</button>
    <button id="note-save" class="btn-primary">保存</button>
  </div>
</div>

<!-- ==================== 全局提示 ==================== -->
<div id="toast" class="toast" hidden></div>

<script src="lib/jszip.min.js"></script>
<script src="lib/epub.min.js"></script>
<script src="lib/db.js"></script>
<script src="lib/parsers.js"></script>
<script src="lib/txt-reader.js"></script>
<script src="app.js"></script>
</body>
</html>
